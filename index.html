<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithms — 26-1</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #22c55e;
      --accent-dim: #16a34a;
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #1a1d24;
      --border: #2a2d35;
      --text: #e2e8f0;
      --text-dim: #8892a4;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .hero {
      background: linear-gradient(135deg, #0a0c10 0%, #0a140d 50%, #0a0c10 100%);
      border-bottom: 1px solid var(--border);
      padding: 72px 24px 56px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(34,197,94,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      color: var(--text-dim);
      font-size: 1rem;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 36px;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 24px;
    }

    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .weeks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .week-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      display: block;
      position: relative;
      overflow: hidden;
    }
    .week-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .week-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(34,197,94,0.1);
    }
    .week-card:hover::before { opacity: 1; }

    .week-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }
    .week-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .week-desc {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .week-arrow {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      font-size: 1.1rem;
    }
    .week-card:hover .week-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }

    @media (max-width: 480px) {
      .weeks-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-label">26-1 · 성균관대학교</div>
    <h1><span>Algorithms</span></h1>
    <p>강의 노트를 인터랙티브 HTML로 변환한 학습 자료 모음입니다.</p>
    <div class="hero-stats">
      <div class="stat">
        <div class="stat-num" id="week-count">1</div>
        <div class="stat-label">주차</div>
      </div>
      <div class="stat">
        <div class="stat-num">26-1</div>
        <div class="stat-label">학기</div>
      </div>
    </div>
  </div>

  <main>
    <div class="section-title">// 주차별 노트</div>
    <div class="weeks-grid" id="weeks-grid"></div>
  </main>

  <footer>thdalswo4524 · Algorithms · 26-1</footer>

  <script>
    const weeks = [
      {
        week: 3,
        title: "Series & Stacks",
        desc: "Arithmetic Series · Polynomial Series · Train Rearrangement · Catalan Number",
        file: "algorithms_3week.html"
      },
    ];

    const grid = document.getElementById('weeks-grid');
    document.getElementById('week-count').textContent = weeks.length;

    weeks.forEach(w => {
      const a = document.createElement('a');
      a.className = 'week-card';
      a.href = w.file;
      a.innerHTML = `
        <div class="week-num">WEEK ${String(w.week).padStart(2, '0')}</div>
        <div class="week-title">${w.title}</div>
        <div class="week-desc">${w.desc}</div>
        <div class="week-arrow">→</div>
      `;
      grid.appendChild(a);
    });
  </script>

</body>
</html>
